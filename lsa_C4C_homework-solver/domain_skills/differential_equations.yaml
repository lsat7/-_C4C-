# ============================================================
# T-box: Differential Equations（常微分方程）—— C4C 扩展领域
# ============================================================
# Oracle sources:
#   - Boyce & DiPrima, Elementary Differential Equations, Ch. 1–3
#
# 求解实现见 scripts/solvers_extended.py 的 solve_ode（SymPy dsolve）。
# ============================================================

domain: differential_equations
version: "1.0"

oracle_sources:
  - type: textbook
    ref: "Boyce & DiPrima, Elementary Differential Equations, 10th ed."
    authority: primary
    distilled_knowledge:
      - "一阶线性 ODE: y' + p(x)y = q(x)，积分因子 μ = exp(∫p dx)"
      - "可分离变量: dy/dx = g(x)h(y) → ∫dy/h(y) = ∫g(x)dx"
      - "二阶常系数齐次: y'' + ay' + by = 0，特征方程 r²+ar+b=0"
      - "通解含任意常数，特解需初始条件（ics）"

concepts:
  - id: first_order_linear
    type: concept
    name: "一阶线性微分方程"
    formal: "y' + p(x)y = q(x)"
    keywords: [y', differential equation, ODE, first order]
    sympy: "dsolve(Eq(f(x).diff(x)+p*f(x), q), f(x))"

  - id: higher_order_linear
    type: concept
    name: "高阶常系数线性微分方程"
    formal: "y'' + ay' + by = g(x)"
    keywords: [y'', second order, higher order]
    sympy: "dsolve(Eq(f(x).diff(x,2)+a*f(x).diff(x)+b*f(x), g), f(x))"

  - id: initial_value_problem
    type: concept
    name: "初值问题（IVP）"
    formal: "ODE + 初始条件 y(x0)=y0"
    keywords: [initial condition, ivp, y(0)]
    sympy: "dsolve(ode, f(x), ics={f(0): y0})"

solution_methods:
  - id: ode_dsolve_solver
    type: solution_method
    concept: first_order_linear
    name: "ODE 符号求解"
    tool: sympy
    solver: solve_ode

classification_rules:
  - priority: 100
    pattern:
      text_contains: ["differential equation", "ode", "y'", "y''", "微分方程"]
    maps_to: first_order_linear
    solver: ode_dsolve_solver
